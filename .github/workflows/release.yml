name: Release (Ubuntu 26.04)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            libgl-dev \
            libturbojpeg-dev \
            dpkg-dev \
            tar

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --config Release

      - name: Package artifacts (.deb and .tar.gz)
        run: |
          TAG=${{ github.ref_name }}
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi

          # 1. Build .deb package via CPack
          cd build && cpack -G DEB
          DEB_FILE=$(ls camera-processor-*.deb)
          VERSIONED_DEB="camera-processor_${TAG#v}_amd64.deb"
          mv "${DEB_FILE}" "../${VERSIONED_DEB}"
          cd ..

          # 2. Build standalone tar.gz archive
          mkdir -p release_package
          cp build/camera-processor release_package/
          cp README.md LICENSE release_package/
          ARCHIVE_NAME="camera-processor-ubuntu-26.04-${TAG}.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" -C release_package camera-processor README.md LICENSE

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
          echo "DEB_NAME=${VERSIONED_DEB}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.DEB_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
